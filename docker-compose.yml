version: "3.9"

services:

  # ── FastAPI ───────────────────────────────────────
  api:
    build: .
    container_name: finsight-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_HOST=http://host.docker.internal:11434   # read by the ollama python client
    volumes:
      - ./chroma_db:/app/chroma_db      # vectors persist
      - ./data:/app/data                # PDFs persist
    command: python src/api.py
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux support

  # ── Streamlit ─────────────────────────────────────
  ui:
    build: .
    container_name: finsight-ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_BASE=http://finsight-api:8000   # service name not localhost
    command: python -m streamlit run ui/app.py
              --server.port 8501
              --server.address 0.0.0.0
              --server.headless true
    depends_on:
      - api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  chroma_db: